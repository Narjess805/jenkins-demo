apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: jenkins-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      nodeSelector:
        kubernetes.io/hostname: devsecops-vm
      containers:
        - name: spring-app-container
          image: docker.io/library/jenkins-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
